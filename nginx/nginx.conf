# ─────────────────────────────────────────────────────────────────────────────
# Nginx — proxy reverso para o FL77 FinOps
#
# Topologia:
#   Internet → Cloudflare Tunnel (HTTPS) → Nginx (HTTP interno) → FastAPI
#
# O Cloudflare Tunnel já cuida do TLS para o mundo externo.
# Aqui o Nginx recebe o tráfego do cloudflared em HTTP e repassa para a API,
# adicionando headers de segurança e limitação de requisições.
# ─────────────────────────────────────────────────────────────────────────────

# Número de workers = número de CPUs disponíveis
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate limiting global (proteção extra além do rate limit da API) ───────
    # 20 requisições por segundo por IP — suficiente para uso normal
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # ── Upstream: a API FastAPI rodando no container "api" ───────────────────
    upstream finops_api {
        server api:8000;
        keepalive 32;
    }

    # ── Servidor principal ───────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;                 # aceita qualquer host (o Cloudflare valida)

        # Tamanho máximo de upload (ajuste se precisar importar extratos)
        client_max_body_size 5M;

        # ── Headers de segurança ─────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin"         always;
        add_header Permissions-Policy        "geolocation=(), camera=()" always;
        # HSTS: Cloudflare já serve HTTPS, mas é boa prática manter
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Health check (não aplica rate limit) ─────────────────────────────
        location = /health {
            proxy_pass         http://finops_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ── Tudo o mais: proxy para a API ────────────────────────────────────
        location / {
            # Rate limiting: permite burst de 40 reqs, processa 20/s
            limit_req zone=api burst=40 nodelay;

            proxy_pass         http://finops_api;
            proxy_http_version 1.1;

            # Headers necessários para o FastAPI identificar o cliente real
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
