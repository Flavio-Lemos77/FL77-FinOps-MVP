<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FL77 FinOps</title>
<style>
/* ── reset & base ──────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#071321;color:#eaf1fb;font:14px/1.5 Inter,system-ui,sans-serif}

/* ── layout ────────────────────────────────────────────────────── */
.app{min-height:100vh;display:grid;grid-template-columns:252px 1fr;
     background:radial-gradient(circle at 85% 0,#19385e,#071321 46%)}
.side{padding:20px 14px;background:#06101d;border-right:1px solid #1e3855;
      display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:28px 32px;max-width:1440px;width:100%}

/* ── sidebar ───────────────────────────────────────────────────── */
.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:17px}
.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
      background:linear-gradient(135deg,#ffb447,#ec6136);color:#071321;font-size:24px;flex-shrink:0}
.brand small{display:block;font-size:9px;color:#9bb0c8;letter-spacing:1.3px}
.portrait{border-radius:14px;overflow:hidden;background:#10253d;border:1px solid #294967}
.portrait img{display:block;width:100%;height:138px;object-fit:cover;object-position:center 20%}
.portrait-info{padding:11px;font-weight:700;font-size:13px}
.portrait-info span{display:block;font-size:11px;font-weight:400;color:#a5bad1;margin-top:3px}
.nav{display:grid;gap:4px}
.nav-btn{border:0;background:transparent;color:#aebed1;text-align:left;padding:11px 12px;
         border-radius:9px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:9px;
         transition:background .15s,color .15s;width:100%}
.nav-btn:hover,.nav-btn.active{background:#19385c;color:#fff}
.nav-btn .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.session-box{margin-top:auto;background:#102740;border-radius:12px;padding:13px;color:#adc2d7;font-size:12px}
.session-box b{color:#fff;display:block;margin-bottom:10px}

/* ── botões ────────────────────────────────────────────────────── */
.btn{border:1px solid #315170;background:#142b44;color:#eaf2fd;padding:9px 14px;
     border-radius:9px;cursor:pointer;font:700 12px inherit;white-space:nowrap;
     transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:linear-gradient(135deg,#ffaf45,#ec6038);color:#101a25;border:0}
.btn.danger{background:#4c1a20;border-color:#8b2a34;color:#ffb4a9}
.btn.success{background:#0d3d2a;border-color:#1a7a55;color:#64deb8}
.btn.sm{padding:6px 11px;font-size:11px}

/* ── cabeçalho da página ───────────────────────────────────────── */
.page-head{display:flex;align-items:center;justify-content:space-between;
           gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{color:#ffae50;font-size:10px;letter-spacing:1.8px;font-weight:800}
.page-head h1{font-size:27px;font-weight:800;margin-top:5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── métricas ──────────────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.metric-card{background:#0b1b2c;border:1px solid #1c3b59;border-radius:14px;padding:16px;
             position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.metric-card.m-income::before{background:#64deb8}
.metric-card.m-expense::before{background:#5ba8d4}
.metric-card.m-commit::before{background:#f97066}
.metric-card.m-balance::before{background:#ffad80}
.metric-card.m-debt::before{background:#9575cd}
.metric-card label{display:block;color:#9eb4cb;font-size:11px;font-weight:600;
                   text-transform:uppercase;letter-spacing:.8px}
.metric-card strong{display:block;font-size:22px;font-weight:800;margin:8px 0 3px}
.metric-card span{font-size:11px;color:#7a90a8}
.m-income strong{color:#64deb8}
.m-expense strong{color:#5ba8d4}
.m-commit strong{color:#f97066}
.m-balance strong{color:#ffad80}
.m-debt strong{color:#9575cd}

/* ── painéis ───────────────────────────────────────────────────── */
.panels{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:#0b1b2c;border:1px solid #1c3b59;border-radius:14px;padding:18px}
.panel-title{display:flex;justify-content:space-between;align-items:center;
             font-weight:750;font-size:13px;margin-bottom:14px}
.panel-title small{font-weight:400;color:#94aac3;font-size:11px}

/* barras de categoria */
.bars-wrap{height:210px;display:flex;align-items:flex-end;gap:10px;
           border-bottom:1px solid #25435e;padding:8px 0 0}
.bar-col{flex:1;min-width:24px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;background:linear-gradient(#51b6df,#287ab8);border-radius:5px 5px 0 0;
     position:relative;min-height:6px}
.bar-val{font-size:9px;font-weight:700;color:#eaf1fb;position:absolute;
         top:-16px;width:100%;text-align:center;white-space:nowrap}
.bar-lbl{font-size:9px;color:#a7bdd2;text-align:center;white-space:nowrap;
         overflow:hidden;max-width:100%;padding:3px 0}

/* track */
.cat-row{display:grid;grid-template-columns:100px 1fr 72px;gap:8px;align-items:center;
         margin:10px 0;font-size:12px;color:#b9cbe0}
.track{height:7px;border-radius:6px;background:#1b3149;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ffab48,#ec6339);border-radius:6px}

/* próximos vencimentos */
.due-row{display:flex;justify-content:space-between;padding:10px 0;
         border-bottom:1px solid #1b334c;gap:8px}
.due-row:last-child{border-bottom:0}
.due-row small{display:block;color:#8fa6c0;margin-top:3px;font-size:11px}
.due-amt{color:#ffb17c;font-weight:700;white-space:nowrap}

/* ── modal ─────────────────────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;z-index:100;
         background:rgba(2,9,20,.88);align-items:flex-start;
         justify-content:center;padding:24px;overflow-y:auto}
.overlay.open{display:flex}
.dialog{width:min(560px,100%);background:#0d2034;border:1px solid #345674;
        border-radius:18px;padding:26px;box-shadow:0 28px 90px #000;
        margin:auto;position:relative}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;
             margin-bottom:4px}
.dialog h2{font-size:18px}
.close-btn{border:0;background:transparent;color:#a9bed1;font-size:26px;
           cursor:pointer;line-height:1;padding:0 4px}
.dialog-sub{color:#a8bdd3;font-size:12px;margin-bottom:18px}

/* ── form ──────────────────────────────────────────────────────── */
.form-grid{display:grid;gap:0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:14px}
.fld label{display:block;color:#b8c9dc;font-size:12px;font-weight:700;margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid #31516e;
  background:#091726;color:#f5f8fd;font:inherit;transition:border-color .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:0;border-color:#4a8ab8}
.fld textarea{resize:vertical;min-height:64px}
.fld.full{grid-column:1/-1}
.fld-check{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.fld-check input{width:auto}
.fld-check label{color:#b8c9dc;font-size:13px;margin:0;cursor:pointer}

/* notice */
.notice{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;
        display:none;align-items:center;gap:8px}
.notice.ok{background:#183c35;color:#8ee8c2;display:flex}
.notice.err{background:#4c282d;color:#ffb4a9;display:flex}

/* form actions */
.form-actions{display:flex;gap:10px;justify-content:flex-end;
              margin-top:20px;padding-top:16px;border-top:1px solid #1c3650}

/* ── tabelas / listas ──────────────────────────────────────────── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#0e2034;color:#94aac3;font-weight:600;font-size:11px;
               text-transform:uppercase;letter-spacing:.7px;padding:10px 12px;
               text-align:left;border-bottom:1px solid #1c3650}
.data-table td{padding:10px 12px;border-bottom:1px solid #162840;vertical-align:middle}
.data-table tr:last-child td{border-bottom:0}
.data-table tr:hover td{background:#0e2236}
.td-actions{display:flex;gap:6px;justify-content:flex-end}

/* badge */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:#0d3d2a;color:#64deb8}
.badge-orange{background:#3a2200;color:#ffad80}
.badge-red{background:#4c1a20;color:#ffb4a9}
.badge-purple{background:#2a1547;color:#c4a3ee}
.badge-gray{background:#1a2d3f;color:#8fa6c0}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters input,.filters select{
  padding:8px 12px;border-radius:8px;border:1px solid #31516e;
  background:#091726;color:#f5f8fd;font:inherit;flex:1;min-width:140px}

/* progress bar de dívida */
.debt-progress{margin-top:6px}
.debt-bar{height:5px;border-radius:4px;background:#1b3149;overflow:hidden;margin-top:3px}
.debt-bar-fill{height:100%;background:linear-gradient(90deg,#64deb8,#1f9e73);border-radius:4px}

/* empty state */
.empty{color:#90a8c1;padding:32px 0;text-align:center;font-size:13px}
.empty big{display:block;font-size:28px;margin-bottom:8px}

/* ── controle de acesso: esconde ações de escrita para viewer ──────── */
body.role-viewer .admin-only{display:none!important}
.viewer-banner{display:none;background:#1a2d3f;border:1px solid #2b4866;
  border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#9db2c9}
body.role-viewer .viewer-banner{display:flex;align-items:center;gap:8px}
.viewer-banner b{color:#7fb0e0}

/* link secundário (criar conta / voltar) */
.link-btn{background:transparent;border:0;color:#7fb0e0;cursor:pointer;
  font:inherit;text-decoration:underline;padding:8px;margin-top:4px}

/* ── auth ──────────────────────────────────────────────────────── */
.auth-overlay{display:flex;position:fixed;inset:0;z-index:200;
              background:#020914;align-items:center;justify-content:center;padding:18px}
.auth-card{width:min(400px,100%);background:#0d2034;border:1px solid #345674;
           border-radius:18px;padding:32px;text-align:center}
.auth-card .brand{justify-content:center;margin-bottom:24px}
.auth-card h2{margin-bottom:6px}
.auth-card p{color:#a8bdd3;font-size:13px;margin-bottom:20px}

/* ── responsivo ────────────────────────────────────────────────── */
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .panels{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .main{padding:16px}
  .metrics{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .page-head{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- ══ AUTH OVERLAY ═══════════════════════════════════════════════════ -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="brand">
      <div class="logo">∞</div>
      <div>FL77 FINOPS<small>ACESSO LOCAL SEGURO</small></div>
    </div>
    <h2 id="authTitle">Verificando…</h2>
    <p id="authSub"></p>
    <form id="authForm" class="form-grid"></form>
    <div id="authNotice" class="notice"></div>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════════ -->
<div class="app" id="appShell" style="display:none">

  <!-- sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="logo">∞</div>
      <div>FL77 FINOPS<small>CONTROLE PESSOAL</small></div>
    </div>
    <div class="portrait">
      <img src="/assets/fl77-finops.jpg" onerror="this.style.display='none'" alt="">
      <div class="portrait-info">Financeiro sob controle
        <span>Seu cockpit financeiro pessoal</span>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" onclick="showPage('dashboard')">
        <span class="icon">▦</span> Visão geral
      </button>
      <button class="nav-btn" onclick="showPage('receitas')">
        <span class="icon">↗</span> Receitas
      </button>
      <button class="nav-btn" onclick="showPage('despesas')">
        <span class="icon">↘</span> Despesas
      </button>
      <button class="nav-btn" onclick="showPage('dividas')">
        <span class="icon">◉</span> Dívidas
      </button>
      <button class="nav-btn" onclick="showPage('pagamentos')">
        <span class="icon">✓</span> Pagamentos
      </button>
    </nav>
    <div class="session-box">
      <b>◉ Sessão protegida</b>
      <button class="btn sm" onclick="doLogout()">Sair</button>
    </div>
  </aside>

  <!-- conteúdo principal -->
  <main class="main" id="mainContent"></main>
</div>

<!-- ══ MODAL GENÉRICO ════════════════════════════════════════════════ -->
<div class="overlay" id="modal">
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="modalTitle"></h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <p class="dialog-sub" id="modalSub">Preencha os campos e salve.</p>
    <form id="modalForm" novalidate></form>
    <div id="modalNotice" class="notice"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   FL77 FinOps — frontend reescrito do zero
   Arquitetura: UM único onsubmit central em #modalForm,
   com dispatch por `currentForm` (string). Zero conflitos de listeners.
══════════════════════════════════════════════════════════════════════ */

/* ── utilidades ─────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const br = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);
const today = () => new Date().toISOString().slice(0,10);

/* estado global */
let currentForm = '';   // 'incomes' | 'expenses' | 'debts' | 'payments' | 'sources' | 'categories'
let editingId   = null; // null = novo, number = editar
let _debts      = [];
let _sources    = [];
let _categories = [];
let _currentPage = 'dashboard';
let _role       = null; // 'admin' | 'viewer'

const isAdmin = () => _role === 'admin';

/* ── api helper ─────────────────────────────────────────────────── */
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch('/api/' + path, opts);
  if (r.status === 204) return null;
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
  return data;
}

/* ── notificações ────────────────────────────────────────────────── */
function showNotice(el, msg, type) {
  el.textContent = msg;
  el.className = 'notice ' + type;
}

/* ── modal ───────────────────────────────────────────────────────── */
function openModal(title, sub) {
  $('#modalTitle').textContent = title;
  $('#modalSub').textContent   = sub || 'Preencha os campos e salve.';
  $('#modalNotice').className  = 'notice';
  $('#modal').classList.add('open');
}
function closeModal() {
  $('#modal').classList.remove('open');
  $('#modalForm').innerHTML = '';
  $('#modalNotice').className = 'notice';
  currentForm = '';
  editingId   = null;
}

/* ── helpers de campo ────────────────────────────────────────────── */
function fld(name, label, type='text', extra='', required=true, full=false) {
  const req = required ? 'required' : '';
  return `<div class="fld${full?' full':''}">
    <label for="f_${name}">${label}</label>
    <input id="f_${name}" name="${name}" type="${type}" ${extra} ${req}>
  </div>`;
}
function sel(name, label, options, full=false, required=true) {
  const req = required ? 'required' : '';
  return `<div class="fld${full?' full':''}">
    <label for="f_${name}">${label}</label>
    <select id="f_${name}" name="${name}" ${req}>${options}</select>
  </div>`;
}
function chk(name, label) {
  return `<div class="fld-check full">
    <input type="checkbox" id="f_${name}" name="${name}">
    <label for="f_${name}">${label}</label>
  </div>`;
}
function debtOptions(includeEmpty=true) {
  const empty = includeEmpty ? '<option value="">— Selecione —</option>' : '';
  return empty + _debts.filter(d=>d.status!=='quitada')
    .map(d=>`<option value="${d.id}">${d.creditor} — ${br(d.current_balance)}</option>`).join('');
}
function sourceOptions() {
  return '<option value="">Não vincular</option>' +
    _sources.map(s=>`<option value="${s.id}">${s.name} — ${br(s.monthly_salary)}</option>`).join('');
}
function catOptions(includeEmpty=false) {
  const e = includeEmpty ? '<option value="" disabled selected>Selecione…</option>' : '';
  return e + _categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
}

/* ── formulários ─────────────────────────────────────────────────── */
function buildForm(kind) {
  currentForm = kind;
  editingId   = null;

  const T = today();
  let html = '<div class="form-grid">';

  if (kind === 'incomes') {
    html += '<div class="form-row">' +
      fld('description','Descrição') +
      fld('amount','Valor (R$)','number','step="0.01" min="0.01"') +
    '</div><div class="form-row">' +
      fld('received_on','Data de recebimento','date',`value="${T}"`) +
      sel('category','Categoria','<option value="Salário">Salário</option><option>Freelance</option><option>Projeto</option><option>Outros</option>') +
    '</div><div class="form-row">' +
      sel('income_type','Tipo','<option>Salário CLT</option><option>Salário PJ</option><option>Freelance</option><option>Projeto</option><option>Venda</option><option>Outros</option>') +
      sel('source_id','Fonte de renda',sourceOptions(),false,false) +
    '</div>';
  }

  else if (kind === 'expenses') {
    html += '<div class="form-row">' +
      fld('description','Descrição','text','',true,'') +
      fld('amount','Valor (R$)','number','step="0.01" min="0.01"') +
    '</div><div class="form-row">' +
      fld('due_on','Data de vencimento','date',`value="${T}"`) +
      sel('category','Categoria',catOptions(true)) +
    '</div><div class="form-row">' +
      sel('status','Situação','<option value="pendente">Pendente</option><option value="pago">Pago</option>') +
      fld('paid_on','Pago em','date','',false) +
    '</div>' +
    chk('recurring','Lançamento recorrente / parcelado') +
    '<div class="form-row">' +
      fld('installments_total','Nº de parcelas','number','min="1" max="600" value="1"',false) +
      fld('review_before_days','Revisar quantos dias antes','number','min="0" max="30" value="5"',false) +
    '</div>';
  }

  else if (kind === 'debts') {
    html += '<div class="form-row">' +
      fld('creditor','Credor (banco / loja / pessoa)') +
      sel('debt_type','Tipo de dívida',
        '<option>Financiamento Imóvel</option><option>Financiamento Veículo</option>' +
        '<option>Cartão de crédito</option><option>Empréstimo pessoal</option>' +
        '<option>Acordo / Renegociação</option><option>Consignado</option>' +
        '<option>Cheque especial</option><option>Outros</option>') +
    '</div><div class="form-row">' +
      fld('original_amount','Valor total financiado (R$)','number','step="0.01" min="0.01"') +
      fld('monthly_installment','Prestação mensal (R$)','number','step="0.01" min="0.01"',false) +
    '</div><div class="form-row">' +
      fld('current_balance','Saldo devedor atual (R$)','number','step="0.01" min="0"') +
      fld('interest_rate','Juros % ao mês','number','step="0.001" min="0"',false) +
    '</div><div class="form-row">' +
      fld('due_day','Dia de vencimento','number','min="1" max="31"',false) +
      sel('status','Status','<option value="ativa">Ativa</option><option value="negociando">Negociando</option><option value="suspensa">Suspensa</option><option value="quitada">Quitada</option>') +
    '</div>';
  }

  else if (kind === 'payments') {
    html += '<div class="form-row">' +
      sel('debt_id','Dívida',debtOptions()) +
      fld('amount','Valor pago (R$)','number','step="0.01" min="0.01"') +
    '</div><div class="form-row">' +
      fld('paid_on','Data do pagamento','date',`value="${T}"`) +
      sel('method','Forma de pagamento',
        '<option>Pix</option><option>Débito</option><option>Boleto</option><option>Transferência</option><option>Dinheiro</option>') +
    '</div>' +
      fld('notes','Observações (opcional)','text','',false,true);
  }

  else if (kind === 'sources') {
    html += '<div class="form-row">' +
      fld('name','Empresa ou projeto') +
      fld('monthly_salary','Renda mensal (R$)','number','step="0.01" min="0.01"') +
    '</div>' +
      sel('source_type','Tipo','<option>Emprego</option><option>Projeto</option><option>Freelance</option><option>Outro</option>',true);
  }

  html += '</div>';
  html += '<div class="form-actions">' +
    '<button type="button" class="btn" onclick="closeModal()">Cancelar</button>' +
    '<button type="submit" class="btn primary" id="submitBtn">Salvar</button>' +
  '</div>';

  $('#modalForm').innerHTML = html;
}

/* ══ ÚNICO HANDLER DE SUBMIT ══════════════════════════════════════ */
$('#modalForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  if (!currentForm) return;

  const fd   = new FormData(e.target);
  const raw  = Object.fromEntries(fd.entries());
  const data = {};

  /* copia campos, converte tipos */
  for (const [k, v] of Object.entries(raw)) {
    if (v === '' || v === null) {
      /* campos opcionais ficam como null */
      const optionals = ['source_id','debt_id','agreement_id','paid_on','notes',
                         'interest_rate','due_day','monthly_installment'];
      if (optionals.includes(k)) { data[k] = null; continue; }
    }
    const numerics = ['amount','original_amount','current_balance','interest_rate',
                      'monthly_installment','monthly_salary','installments_total',
                      'installment_number','review_before_days','due_day'];
    const ints = ['source_id','debt_id','agreement_id','installments_total',
                  'installment_number','review_before_days','due_day'];
    if (numerics.includes(k)) {
      if (v === '') { data[k] = null; continue; }
      data[k] = ints.includes(k) ? parseInt(v,10) : parseFloat(v);
    } else {
      data[k] = v;
    }
  }

  /* checkbox recurring */
  if (currentForm === 'expenses') {
    data.recurring = !!fd.get('recurring');
    if (!data.installments_total) data.installments_total = 1;
    if (!data.review_before_days && data.review_before_days !== 0) data.review_before_days = 5;
  }

  /* limpar zeros opcionais */
  if (data.source_id === 0) data.source_id = null;
  if (data.debt_id   === 0) data.debt_id   = null;

  const btn = $('#submitBtn');
  btn.disabled = true;
  btn.textContent = 'Salvando…';

  try {
    const route = currentForm === 'sources' ? 'income-sources' : currentForm;
    if (editingId) {
      await api('PUT', `${route}/${editingId}`, data);
    } else {
      await api('POST', route, data);
    }
    showNotice($('#modalNotice'), editingId ? 'Registro atualizado!' : 'Registro salvo com sucesso!', 'ok');
    /* atualiza cache e recarrega a página atual */
    await refreshCache();
    await renderPage(_currentPage);
    setTimeout(closeModal, 700);
  } catch(err) {
    showNotice($('#modalNotice'), err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar';
  }
});

/* ── abrir formulário para edição ─────────────────────────────────── */
async function openEdit(kind, id) {
  const route = kind === 'sources' ? 'income-sources' : kind;
  const row   = await api('GET', route + '/' + id).catch(() => null)
    || (await api('GET', route)).find(x => x.id === id);
  if (!row) return;

  buildForm(kind);
  editingId = id;
  openModal('Editar registro');

  /* preenche campos */
  for (const [k, v] of Object.entries(row)) {
    const el = $(`[name="${k}"]`);
    if (!el || v === null || v === undefined) continue;
    if (el.type === 'checkbox') { el.checked = !!v; continue; }
    el.value = v;
  }
  $('#submitBtn').textContent = 'Atualizar';
}

/* ── excluir ─────────────────────────────────────────────────────── */
async function doDelete(kind, id, label) {
  if (!confirm(`Excluir "${label}"?\nEsta ação não pode ser desfeita.`)) return;
  const route = kind === 'sources' ? 'income-sources' : kind;
  try {
    await api('DELETE', route + '/' + id);
    await refreshCache();
    await renderPage(_currentPage);
  } catch(err) {
    alert('Erro ao excluir: ' + err.message);
  }
}

/* ── cache ────────────────────────────────────────────────────────── */
async function refreshCache() {
  [_debts, _sources, _categories] = await Promise.all([
    api('GET','debts'),
    api('GET','income-sources'),
    api('GET','categories'),
  ]);
}

/* ══ PÁGINAS ══════════════════════════════════════════════════════ */
function showPage(page) {
  _currentPage = page;
  $$('.nav-btn').forEach(b => b.classList.remove('active'));
  const idx = {dashboard:0,receitas:1,despesas:2,dividas:3,pagamentos:4};
  const btns = $$('.nav-btn');
  if (btns[idx[page]]) btns[idx[page]].classList.add('active');
  renderPage(page);
}

async function renderPage(page) {
  const main = $('#mainContent');
  main.innerHTML = '<div class="empty"><big>⌛</big>Carregando…</div>';
  try {
    if (page === 'dashboard')   await pageDashboard(main);
    else if (page === 'receitas')   await pageReceitas(main);
    else if (page === 'despesas')   await pageDespesas(main);
    else if (page === 'dividas')    await pageDividas(main);
    else if (page === 'pagamentos') await pagePagamentos(main);
  } catch(err) {
    main.innerHTML = `<div class="empty"><big>⚠</big>${err.message}</div>`;
  }
}

        }).join('') : '<tr><td colspan="6"><div class="empty"><big>💳</big>Nenhum pagamento registrado.</div></td></tr>'}
      </tbody>
    </table>
  </div>`;
}

/* ── filtros de tabela ────────────────────────────────────────────── */
function filterTable(page) {
  const q   = ($('#f_search')||{value:''}).value.toLowerCase();
  const cat = ($('#f_cat')||{value:''}).value;
  const st  = ($('#f_status')||{value:''}).value;
  const tp  = ($('#f_type')||{value:''}).value;
  const met = ($('#f_method')||{value:''}).value;
  const fr  = ($('#f_from')||{value:''}).value;
  const to  = ($('#f_to')||{value:''}).value;

  const tbl = $(`#tbl_${page}`);
  const cards = page === 'dividas' ? $$('#debtCards>[data-credor]') : null;

  const rows = tbl ? tbl.querySelectorAll('tbody tr') : cards || [];
  rows.forEach(row => {
    let show = true;
    if (q)   show = show && (row.dataset.desc||row.dataset.credor||'').includes(q);
    if (cat) show = show && row.dataset.cat  === cat;
    if (st)  show = show && row.dataset.status === st;
    if (tp)  show = show && row.dataset.type  === tp;
    if (met) show = show && row.dataset.method === met;
    const d = row.dataset.date || '';
    if (fr)  show = show && d >= fr + '-01';
    if (to) {
      const [y,m] = to.split('-').map(Number);
      const ld = new Date(y,m,0).getDate();
      show = show && d <= to + '-' + String(ld).padStart(2,'0');
    }
    row.style.display = show ? '' : 'none';
  });
}

/* ══ AUTH ══════════════════════════════════════════════════════════ */
let _authMode = 'login'; // 'login' | 'signup'

async function initAuth() {
  const st = await api('GET','auth/status');

  if (st.authenticated) {
    _role = st.role || 'viewer';
    document.body.classList.toggle('role-viewer', _role !== 'admin');
    $('#authOverlay').style.display = 'none';
    $('#appShell').style.display = 'grid';
    await refreshCache();
    renderPage('dashboard');
    return;
  }

  const setup = !st.configured;
  if (setup) return renderSetupForm();
  if (_authMode === 'signup') return renderSignupForm();
  renderLoginForm();
}

/* primeira execução — cria o administrador master */
function renderSetupForm() {
  $('#authTitle').textContent = 'Criar acesso de administrador';
  $('#authSub').textContent   = 'Primeiro acesso: defina o usuário administrador do sistema.';
  $('#authForm').innerHTML = `
    <div class="fld"><label>Usuário (e-mail do admin)</label>
      <input name="username" required minlength="3" autocomplete="username"></div>
    <div class="fld"><label>Senha</label>
      <input name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <div class="form-actions" style="justify-content:center;border:0;padding-top:8px">
      <button type="submit" class="btn primary" style="width:100%;padding:12px">Criar administrador</button>
    </div>`;
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('POST','auth/setup', Object.fromEntries(new FormData(e.target)));
      initAuth();
    } catch(err) { showNotice($('#authNotice'), err.message, 'err'); }
  };
}

/* login normal */
function renderLoginForm() {
  $('#authNotice').className = 'notice';
  $('#authTitle').textContent = 'Entrar no FL77 FinOps';
  $('#authSub').textContent   = 'Use suas credenciais para acessar o painel.';
  $('#authForm').innerHTML = `
    <div class="fld"><label>Usuário</label>
      <input name="username" required minlength="3" autocomplete="username"></div>
    <div class="fld"><label>Senha</label>
      <input name="password" type="password" required minlength="8" autocomplete="current-password"></div>
    <div class="form-actions" style="justify-content:center;border:0;padding-top:8px">
      <button type="submit" class="btn primary" style="width:100%;padding:12px">Entrar</button>
    </div>
    <button type="button" class="link-btn" onclick="_authMode='signup';initAuth()">
      Não tem acesso? Criar uma conta
    </button>`;
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('POST','auth/login', Object.fromEntries(new FormData(e.target)));
      _authMode = 'login';
      initAuth();
    } catch(err) { showNotice($('#authNotice'), err.message, 'err'); }
  };
}

/* cadastro de novo usuário — perfil SOMENTE LEITURA */
function renderSignupForm() {
  $('#authNotice').className = 'notice';
  $('#authTitle').textContent = 'Criar conta';
  $('#authSub').textContent   = 'Novos usuários têm acesso de visualização (somente leitura).';
  $('#authForm').innerHTML = `
    <div class="fld"><label>Usuário (login)</label>
      <input name="username" required minlength="3" placeholder="ex.: ligia.antonelli"></div>
    <div class="fld"><label>E-mail</label>
      <input name="email" type="email" required placeholder="voce@exemplo.com"></div>
    <div class="fld"><label>Telefone</label>
      <input name="phone" required placeholder="(11) 99999-9999"></div>
    <div class="fld"><label>E-mail de recuperação</label>
      <input name="recovery_email" type="email" required placeholder="recuperacao@exemplo.com"></div>
    <div class="fld"><label>Senha</label>
      <input name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <div class="form-actions" style="justify-content:center;border:0;padding-top:8px">
      <button type="submit" class="btn primary" style="width:100%;padding:12px">Criar conta</button>
    </div>
    <button type="button" class="link-btn" onclick="_authMode='login';initAuth()">
      Já tenho conta — voltar ao login
    </button>`;
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('POST','auth/signup', Object.fromEntries(new FormData(e.target)));
      showNotice($('#authNotice'), 'Conta criada! Faça login para entrar.', 'ok');
      _authMode = 'login';
      setTimeout(initAuth, 1200);
    } catch(err) { showNotice($('#authNotice'), err.message, 'err'); }
  };
}

async function doLogout() {
  await api('POST','auth/logout');
  location.reload();
}
